[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/arpeggi5150/SolPlugs"

[workspace.dependencies]
solplugs-pitch-core = { path = "crates/pitch-core" }
solplugs-pitch-app = { path = "crates/pitch-app" }
solplugs-comp-core = { path = "crates/comp-core" }
solplugs-comp-app = { path = "crates/comp-app" }
solplugs-eq-core = { path = "crates/eq-core" }
solplugs-eq-app = { path = "crates/eq-app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rustfft = "6"
# Audio-thread hand-off without locks.
rtrb = "0.3"
arc-swap = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
dbg_macro = "warn"
too_many_arguments = "deny"
# DSP loops index several parallel arrays; iterator chains read worse there.
needless_range_loop = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 4

# The DSP tests render seconds of audio; unoptimised they take minutes.
[profile.test]
opt-level = 2

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/arpeggi5150/SolPlugs"

[workspace.dependencies]
solplugs-midi-keys = { path = "crates/midi-keys" }
# Solara's plugin model and VST3 host, shared (one VST3 host for Solara, SolPlugs and Command Center).
soundcraft-dsp = { git = "https://github.com/arpeggi5150/Solara", branch = "main" }
soundcraft-vst3-host = { git = "https://github.com/arpeggi5150/Solara", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Audio-thread hand-off without locks.
rtrb = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
dbg_macro = "warn"
too_many_arguments = "deny"
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 4

[package]
name = "solplugs-ref-io"
description = "Decoding, the reference library, and the Deezer preview search for the SolPlugs reference analyzer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["deezer"]
# Online search through the Deezer public API. Previews stream into memory only (see deezer.rs).
deezer = ["dep:ureq"]

[dependencies]
solplugs-ref-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
hound = "3.5"
claxon = "0.4"
nanomp3 = "0.2"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "json"], optional = true }

[lints]
workspace = true

[package]
name = "solplugs-eq-app"
description = "SolPlugs EQ engine and UI: parameters with per-style memory, presets, A/B, MATCH and auto-makeup, the audio-thread processor, the spectrum analyzer and the egui interface (shared by the plugin, the standalone app and Solara)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
solplugs-eq-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rtrb.workspace = true
rustfft.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

[lints]
workspace = true

[dev-dependencies]
hound = "3"

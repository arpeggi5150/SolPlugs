[package]
name = "solplugs-reverb-app"
description = "SolPlugs Verb engine and UI: parameters with per-version memory, presets, A/B, MATCH and auto-makeup, the audio-thread processor, and the egui interface (digital-first or stacked; shared by the plugin, the standalone app and Solara)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
solplugs-reverb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rtrb.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

[lints]
workspace = true

[dev-dependencies]
hound = "3"

[package]
name = "solplugs-samples-standalone"
description = "SolPlugs Samples in its own window: the sample manager as a standalone app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "solplugs-samples"
path = "src/main.rs"

[dependencies]
solplugs-samples-app.workspace = true
log.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"] }

# Preview output on Windows (WASAPI, shared mode, so the DAW keeps its device).
[target.'cfg(windows)'.dependencies]
cpal = "0.18"

[lints]
workspace = true

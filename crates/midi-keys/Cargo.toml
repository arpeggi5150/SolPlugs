[package]
name = "solplugs-midi-keys"
description = "SolPlugs MIDI Keys: play VST3 (and Solara's built-in) synths from hardware MIDI keyboards, 1-4 tracks with their own input, low latency. Shared by Solara and Command Center."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
soundcraft-dsp.workspace = true
soundcraft-vst3-host.workspace = true
serde.workspace = true
log.workspace = true
rtrb.workspace = true

# Devices (MIDI in, audio out) on Windows: WinMM MIDI and WASAPI audio, no system packages needed.
[target.'cfg(windows)'.dependencies]
midir = "0.11"
cpal = "0.18"

[lints]
workspace = true
